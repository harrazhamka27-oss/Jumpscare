
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ujian Keberanian 👻</title>
<style>
body {
  background: #090909;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 30px 12px;
}
h1 { color: #ff3030; }
button {
  padding: 15px 22px;
  font-size: 18px;
  font-weight: bold;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}
video {
  width: 100%;
  max-width: 600px;
  margin-top: 20px;
}
</style>
</head>
<body>
<h1>👻 UJIAN KEBERANIAN</h1>
<p>Berani tengok sampai habis?</p>
<p>Amaran: video mengandungi jumpscare dan jeritan kuat.</p>
<button onclick="startScare()">MULA 👀</button>
<div id="screen"></div>

<script>
function startScare() {
  document.getElementById("screen").innerHTML =
    '<h2>BERSIAP SEDIA...</h2>' +
    '<video controls autoplay playsinline>' +
    '<source src="jumpscare.mp4" type="video/mp4">' +
    '</video>' +
    '<p>Tekan Play jika video tidak bermula.</p>';
}
</script>
</body>
</html>
